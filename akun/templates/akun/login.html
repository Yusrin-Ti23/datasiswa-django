<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Sistem Data Siswa</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0d6efd, #6610f2);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,.2);
        }

        .login-icon {
            width: 80px;
            height: 80px;
            margin: auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d6efd;
            color: white;
            font-size: 35px;
        }
    </style>
</head>

<body>

<div class="card login-card p-4">

    <div class="text-center mb-4">

        <div class="login-icon mb-3">
            🔐
        </div>

        <h3 class="fw-bold">
            Sistem Data Siswa
        </h3>

        <p class="text-muted">
            Silakan login untuk mengakses sistem ini
        </p>

    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">
                Username
            </label>

            <input
                type="text"
                name="username"
                class="form-control form-control-lg"
                placeholder="Masukkan username"
                required
            >
        </div>

        <div class="mb-4">
            <label class="form-label">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control form-control-lg"
                placeholder="Masukkan password"
                required
            >
        </div>

        <button
            type="submit"
            class="btn btn-primary btn-lg w-100"
        >
            🔑 Login
        </button>

    </form>

    <div class="text-center mt-4">
        <small class="text-muted">
            © 2026 Sistem Data Siswa
        </small>
    </div>

</div>

</body>
</html>
